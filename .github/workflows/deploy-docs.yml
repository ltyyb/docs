name: 部署文档

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 pnpm 和 Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查类型
        run: pnpm typecheck

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm docs:build

      - name: 检查静态页面与链接
        run: pnpm check

      - name: 部署文档
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: out
